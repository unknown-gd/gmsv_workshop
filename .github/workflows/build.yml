name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [linux64, linux32]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        run: nix build ".#${{ matrix.package }}" --print-build-logs

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: gmsv_workshop-${{ matrix.package }}
          path: result/lib/gmsv_workshop_*.dll
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win64
            arch: x64
          - target: win32
            arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset ${{ matrix.target }}

      - name: Build
        run: cmake --build --preset ${{ matrix.target }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.target }} --output-on-failure

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: gmsv_workshop-${{ matrix.target }}
          path: build/${{ matrix.target }}/gmsv_workshop_*.dll
          if-no-files-found: error
